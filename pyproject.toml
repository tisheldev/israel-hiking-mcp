[project]
name = "israel-hiking-mcp"
version = "0.1.0"
description = "Unofficial, non-commercial, read-only MCP server for Israel Hiking Map (Mapeak) data"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.28.1",
    "mapbox-vector-tile>=2.1",
    "mcp>=1.28,<2",
    "mercantile>=1.2.1",
    "pydantic-settings>=2.6",
    "shapely>=2.0",
]

[project.scripts]
israel-hiking-mcp = "ihm_mcp.server:main"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "respx>=0.22",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ihm_mcp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
# The live group is deselected by default, so the suite runs offline and sends
# nothing to a volunteer-run service. `-m live` on the command line replaces
# this expression and runs only those.
addopts = "-m 'not live'"
markers = [
    "live: talks to the real mapeak.com and openstreetmap.org; run with `-m live`",
]
