[project]
name = "israel-hiking-mcp"
version = "0.1.0"
description = "Unofficial, non-commercial, read-only MCP server for Israel Hiking Map (Mapeak) data"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "mcp>=1.28,<2",
]

[project.scripts]
israel-hiking-mcp = "ihm_mcp.server:main"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ihm_mcp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
